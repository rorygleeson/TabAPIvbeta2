<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TAB Template — Scene 1</title><style>
/* PREVIEW_ONLY_CSS */:root{--text:#f8fbff;--muted:#90a4b3;--green2:#8affb8;--shell-top:58px;--shell-bottom:56px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020609;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}@media(orientation:portrait){:root{--shell-top:92px;--shell-bottom:76px}}
/* SCENE_PRODUCTION_CSS_START */
.scene-type-1{--s1-text:#f8fbff;--s1-muted:#90a4b3;--s1-green2:#8affb8;position:absolute;left:0;right:0;top:var(--shell-top);bottom:var(--shell-bottom);display:flex;align-items:center;padding:4.8vh 6vw;overflow:hidden;color:var(--s1-text)}
.scene-type-1 .s1-copy{width:min(1040px,88vw);position:relative;z-index:5}
.scene-type-1 .s1-reveal{opacity:0;transform:translateY(18px);filter:blur(5px);transition:opacity .55s ease,transform .65s cubic-bezier(.16,1,.3,1),filter .55s ease}
.scene-type-1 .s1-reveal.is-visible{opacity:1;transform:none;filter:none}
.scene-type-1 .s1-kicker{font-size:clamp(12px,1.15vw,18px);font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:var(--s1-green2);margin-bottom:14px}
.scene-type-1 .s1-hero{font-size:clamp(44px,6vw,100px);line-height:.88;letter-spacing:-.055em;font-weight:950;margin:0;text-wrap:balance}
.scene-type-1 .s1-accent{color:var(--s1-green2);display:inline-block;margin-top:.08em}
.scene-type-1 .s1-stats{font-size:clamp(20px,2vw,31px);line-height:1.25;font-weight:900;margin-top:22px;color:white}
.scene-type-1 .s1-meetings{font-size:clamp(16px,1.5vw,25px);line-height:1.4;color:var(--s1-muted);margin-top:14px;max-width:900px}
.scene-type-1 .s1-teaser{font-size:clamp(20px,2vw,32px);line-height:1.28;font-weight:850;margin-top:22px;max-width:900px;color:#eaf4f8}

/* Scene 1 closing launch beat */
.scene-type-1 .s1-close{
  margin-top:24px;
  display:flex;
  align-items:center;
  flex-wrap:nowrap;
  gap:.25em;
  white-space:nowrap;
  font-size:clamp(27px,3vw,48px);
  line-height:1;
  font-weight:950;
  letter-spacing:.045em;
  text-transform:uppercase;
  color:var(--s1-green2);
}

.scene-type-1 .s1-close-word{
  display:inline-block;
  opacity:0;
  transform:translateY(18px) scale(.72);
  filter:blur(5px);
}

.scene-type-1 .s1-close-word.is-on{
  animation:s1WordPunch .48s cubic-bezier(.16,1,.3,1) forwards;
}

.scene-type-1 .s1-close-word.s1-back.is-on{
  animation:s1BackPunch .58s cubic-bezier(.16,1,.3,1) forwards;
}

.scene-type-1 .s1-launch-shockwave{
  position:absolute;
  z-index:19;
  left:50%;
  top:50%;
  width:120px;
  height:120px;
  margin:-60px 0 0 -60px;
  border:6px solid rgba(138,255,184,.95);
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  box-shadow:0 0 36px rgba(90,255,156,.95),0 0 90px rgba(39,224,130,.65),inset 0 0 30px rgba(190,255,216,.55);
  transform:scale(.18);
}

.scene-type-1 .s1-launch-shockwave.is-on{
  animation:s1Shockwave .82s cubic-bezier(.16,1,.3,1) both;
}

.scene-type-1 .s1-launch-flash{
  position:absolute;
  z-index:20;
  inset:-8%;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,1) 0%,rgba(214,255,229,.98) 10%,rgba(95,255,159,.96) 24%,rgba(19,220,112,.86) 44%,rgba(4,90,47,.58) 68%,rgba(2,6,9,0) 82%),
    linear-gradient(90deg,rgba(138,255,184,0) 0%,rgba(138,255,184,.5) 48%,rgba(255,255,255,.85) 50%,rgba(138,255,184,.5) 52%,rgba(138,255,184,0) 100%);
  mix-blend-mode:screen;
}

.scene-type-1 .s1-launch-flash.is-on{
  animation:s1LaunchFlash .92s cubic-bezier(.16,1,.3,1) both;
}

.scene-type-1.s1-launch-hit .s1-copy{
  animation:s1LaunchHit .46s cubic-bezier(.16,1,.3,1) both;
}

@keyframes s1WordPunch{
  0%{opacity:0;transform:translateY(18px) scale(.72);filter:blur(5px)}
  58%{opacity:1;transform:translateY(-2px) scale(1.08);filter:blur(0)}
  100%{opacity:1;transform:none;filter:none}
}

@keyframes s1BackPunch{
  0%{opacity:0;transform:translateY(18px) scale(.65);filter:blur(6px)}
  52%{opacity:1;transform:translateY(-3px) scale(1.18);filter:blur(0);text-shadow:0 0 30px rgba(138,255,184,.75)}
  100%{opacity:1;transform:none;filter:none;text-shadow:0 0 16px rgba(138,255,184,.35)}
}

@keyframes s1Shockwave{
  0%{opacity:0;transform:scale(.18);border-width:8px}
  18%{opacity:1;transform:scale(.42);border-width:7px}
  72%{opacity:.9;transform:scale(7.2);border-width:3px}
  100%{opacity:0;transform:scale(10.5);border-width:1px}
}

@keyframes s1LaunchFlash{
  0%{opacity:0;transform:scale(.72)}
  12%{opacity:.45;transform:scale(.84)}
  24%{opacity:1;transform:scale(1)}
  38%{opacity:.98;transform:scale(1.08)}
  58%{opacity:.62;transform:scale(1.18)}
  100%{opacity:0;transform:scale(1.34)}
}

@keyframes s1LaunchHit{
  0%{transform:scale(1)}
  34%{transform:scale(1.028)}
  62%{transform:scale(.992)}
  100%{transform:scale(1)}
}

@media(orientation:portrait){
  .scene-type-1{align-items:center;padding:32px 7vw 40px}
  .scene-type-1 .s1-copy{width:100%}
  .scene-type-1 .s1-kicker{font-size:12px;line-height:1.45;margin-bottom:16px}
  .scene-type-1 .s1-hero{font-size:clamp(48px,12.4vw,78px);line-height:.91}
  .scene-type-1 .s1-stats{font-size:clamp(20px,5.2vw,28px);margin-top:24px}
  .scene-type-1 .s1-meetings{font-size:clamp(17px,4.4vw,23px);line-height:1.42;margin-top:12px}
  .scene-type-1 .s1-teaser{font-size:clamp(20px,5.3vw,28px);line-height:1.3;margin-top:22px}
  .scene-type-1 .s1-close{
    font-size:clamp(22px,6.1vw,36px);
    letter-spacing:.025em;
    gap:.20em;
    margin-top:24px;
  }
}

@media(orientation:portrait) and (max-height:760px){
  .scene-type-1{align-items:flex-start;padding-top:28px}
  .scene-type-1 .s1-hero{font-size:clamp(42px,10.8vw,65px)}
  .scene-type-1 .s1-stats{margin-top:18px}
  .scene-type-1 .s1-teaser{margin-top:16px}
  .scene-type-1 .s1-close{margin-top:18px}
}


@media (orientation:landscape) and (max-height:900px){
  .scene-type-1{
    padding:3vh 6vw;
  }

  .scene-type-1 .s1-hero{
    font-size:clamp(36px,3.9vw,60px);
    line-height:.92;
  }

  .scene-type-1 .s1-stats{
    font-size:clamp(16px,1.3vw,21px);
    margin-top:16px;
  }

  .scene-type-1 .s1-meetings{
    font-size:clamp(14px,1.05vw,18px);
    margin-top:10px;
  }

  .scene-type-1 .s1-teaser{
    font-size:clamp(16px,1.3vw,21px);
    margin-top:16px;
  }

  .scene-type-1 .s1-close{
    font-size:clamp(20px,1.85vw,29px);
    margin-top:18px;
  }
}

/* SCENE_PRODUCTION_CSS_END */</style></head><body>
<!-- SCENE_PRODUCTION_MARKUP_START --><main class="scene-type-1" data-scene-type="1" data-scene-instance-id="{{sceneInstanceId}}" data-duration-ms="{{sceneDurationMs}}"><div class="s1-copy"><div class="s1-kicker s1-reveal" data-reveal="intro">{{dateDisplay}} • YOUR RACING DAY, {{userName}}</div><h1 class="s1-hero s1-reveal" data-reveal="hero">{{userName}},<br><span class="s1-accent">{{totalBets}} BETS.</span><br>ONE BIG CARD.</h1><div class="s1-stats s1-reveal" data-reveal="stats">{{totalStakedDisplay}} staked. {{meetingCount}} meetings.</div><div class="s1-meetings s1-reveal" data-reveal="meetings">{{meetingJourney}}</div><div class="s1-teaser s1-reveal" data-reveal="teaser">{{openingTeaser}}</div><div class="s1-close" data-reveal="close">{{closingHook}}</div></div><div class="s1-launch-shockwave" data-role="s1-launch-shockwave"></div><div class="s1-launch-flash" data-role="s1-launch-flash"></div></main><!-- SCENE_PRODUCTION_MARKUP_END -->
</body></html>
