<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scene 4 Template</title><style>
/* PREVIEW_ONLY_CSS */:root{--green:#20d779;--green-soft:#7cf0ae;--red:#ff5c68;--white:#f5f7f6;--muted:#9ba8a2;--line:rgba(255,255,255,.12);--shell-top:58px;--shell-bottom:56px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050807;color:var(--white);font-family:Arial,sans-serif;overflow:hidden}@media(orientation:portrait){:root{--shell-top:92px;--shell-bottom:76px}}
/* SCENE_PRODUCTION_CSS_START */
.scene-type-4{--green:#20d779;--green-soft:#7cf0ae;--red:#ff5c68;--white:#f5f7f6;--muted:#9ba8a2;--line:rgba(255,255,255,.12);position:absolute;left:0;right:0;top:var(--shell-top);bottom:var(--shell-bottom);display:flex;align-items:center;justify-content:center;padding:36px 7vw 88px;overflow:hidden;background:radial-gradient(circle at 50% 34%,rgba(31,215,121,.12),transparent 35%),linear-gradient(180deg,#07100c 0%,#050807 58%,#020403 100%)}.scene-type-4::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);pointer-events:none}.scene-type-4 .s4-wrap{width:min(860px,86vw);text-align:center;position:relative;z-index:1}.scene-type-4 .s4-kicker{font-size:clamp(14px,2.6vw,20px);letter-spacing:.22em;font-weight:800;color:var(--muted);margin-bottom:16px;opacity:0;transform:translateY(8px)}.scene-type-4 .s4-pnl-label{font-size:clamp(15px,2.8vw,21px);color:#dfe7e3;font-weight:800;letter-spacing:.08em;opacity:0;transform:translateY(8px)}.scene-type-4 .s4-pnl{font-size:clamp(58px,14vw,108px);line-height:.95;font-weight:900;letter-spacing:-.045em;margin-top:8px;opacity:0;transform:scale(.95)}.scene-type-4 .s4-pnl.positive{color:var(--green);text-shadow:0 0 36px rgba(32,215,121,.17)}.scene-type-4 .s4-pnl.negative{color:var(--red);text-shadow:0 0 36px rgba(255,92,104,.14)}.scene-type-4 .s4-pnl.zero{color:var(--white)}.scene-type-4 .s4-stats{margin:26px auto 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:760px;opacity:0;transform:translateY(10px)}.scene-type-4 .s4-stat{padding:16px 10px}.scene-type-4 .s4-stat+.s4-stat{border-left:1px solid var(--line)}.scene-type-4 .s4-stat-value{display:block;font-size:clamp(22px,5vw,36px);font-weight:900;color:#fff}.scene-type-4 .s4-stat-label{display:block;margin-top:5px;font-size:clamp(10px,2vw,13px);font-weight:800;letter-spacing:.12em;color:var(--muted)}.scene-type-4 .s4-story{max-width:760px;margin:24px auto 0;font-size:clamp(22px,5.4vw,38px);line-height:1.12;font-weight:850;opacity:0;transform:translateY(10px)}.scene-type-4 .s4-ahead{max-width:720px;margin:17px auto 0;font-size:clamp(15px,3.3vw,22px);line-height:1.3;color:var(--green-soft);font-weight:800;opacity:0;transform:translateY(8px)}.scene-type-4.play .s4-kicker{animation:s4in .45s ease forwards .15s}.scene-type-4.play .s4-pnl-label{animation:s4in .45s ease forwards .55s}.scene-type-4.play .s4-pnl{animation:s4pop .55s cubic-bezier(.2,.85,.2,1) forwards 1.35s}.scene-type-4.play .s4-stats{animation:s4in .5s ease forwards 2.05s}.scene-type-4.play .s4-story{animation:s4in .5s ease forwards 2.9s}.scene-type-4.play .s4-ahead{animation:s4in .5s ease forwards 4s}@keyframes s4in{to{opacity:1;transform:none}}@keyframes s4pop{to{opacity:1;transform:scale(1)}}@media(max-width:640px){.scene-type-4{padding-left:6vw;padding-right:6vw}.scene-type-4 .s4-wrap{width:88vw}.scene-type-4 .s4-stat{padding:14px 5px}}

/* LAPTOP / SHORT LANDSCAPE COMPACTION — ALIGNED WITH SCENES 2 & 5 */
@media (orientation:landscape) and (max-height:900px){
  .scene-type-4{align-items:flex-start;padding:18px 7vw 122px}
  .scene-type-4 .s4-wrap{width:min(800px,82vw)}
  .scene-type-4 .s4-kicker{font-size:11px;margin-bottom:7px}
  .scene-type-4 .s4-pnl-label{font-size:clamp(12px,1.05vw,15px)}
  .scene-type-4 .s4-pnl{font-size:clamp(40px,4.4vw,60px);line-height:.95;margin-top:4px}
  .scene-type-4 .s4-stats{margin-top:12px;max-width:760px}
  .scene-type-4 .s4-stat{padding:9px 8px}
  .scene-type-4 .s4-stat-value{font-size:clamp(18px,1.8vw,25px)}
  .scene-type-4 .s4-stat-label{margin-top:3px;font-size:10px}
  .scene-type-4 .s4-story{margin-top:12px;font-size:clamp(17px,1.65vw,23px);line-height:1.14}
  .scene-type-4 .s4-ahead{margin-top:8px;font-size:clamp(13px,1.15vw,16px);line-height:1.25}
}
/* SCENE_PRODUCTION_CSS_END */</style></head><body>
<!-- SCENE_PRODUCTION_MARKUP_START --><section class="scene-type-4" data-scene-type="4" data-scene-instance-id="{{sceneInstanceId}}"><div class="s4-wrap"><div class="s4-kicker">WHERE THINGS STAND AT {{checkpointTime}}</div><div class="s4-pnl-label">{{userName}} IS<span class="s4-dots">...</span></div><div class="s4-pnl {{pnlSignClass}}">{{checkpointPnlDisplay}} <span class="s4-direction">{{checkpointDirection}}</span></div><div class="s4-stats"><div class="s4-stat"><span class="s4-stat-value">{{betsCompleted}} / {{totalBets}}</span><span class="s4-stat-label">BETS RUN</span></div><div class="s4-stat"><span class="s4-stat-value">{{winnersSoFar}}</span><span class="s4-stat-label">WINNERS SO FAR</span></div><div class="s4-stat"><span class="s4-stat-value">{{bestWinSummarySoFar}}</span><span class="s4-stat-label">BEST WIN</span></div></div><div class="s4-story">{{lookingBackStory}}</div><div class="s4-ahead">{{lookingAheadTeaser}}</div></div></section><!-- SCENE_PRODUCTION_MARKUP_END -->
</body></html>
