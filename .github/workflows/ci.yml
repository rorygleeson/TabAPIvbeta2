name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lambda/builder-recap/package-lock.json

      - name: Install builder dependencies
        working-directory: lambda/builder-recap
        run: npm ci --ignore-scripts

      - name: Install scene planner dependencies
        working-directory: lambda/scene-planner
        run: npm ci --ignore-scripts

      - name: Install orchestrator dependencies
        working-directory: lambda/orchestrator
        run: npm install --ignore-scripts

      - name: Syntax check builder JavaScript
        run: |
          node --check lambda/builder-recap/index.js
          node --check lambda/builder-recap/recap-builder.js
          node --check lambda/builder-recap/recap-builder.test.js
          node --check lambda/builder-recap/builder-plan-guard.js
          node --check lambda/builder-recap/builder-plan-guard.test.js
          node --check lambda/builder-recap/runtime/recap-runtime.js

      - name: Verify shared canonical bettings validator
        run: |
          test -f shared/canonical-bettings-validator.js
          test -f shared/canonical-bettings-validator.test.js
          node --check shared/canonical-bettings-validator.js
          node --check shared/canonical-bettings-validator.test.js
          node shared/canonical-bettings-validator.test.js
          grep -F "validateCanonicalBettingsSemantics" lambda/builder-recap/recap-builder.js
          grep -F "validateCanonicalBettingsSemantics" lambda/orchestrator/index.js
          test -f contracts/bettings.schema.json
          echo "OK: shared canonical bettings semantic validator is used by Builder and Orchestrator."

      - name: Run builder Scene 8 regression tests
        run: node lambda/builder-recap/recap-builder.test.js

      - name: Run builder independent planner-invariant regression tests
        run: node lambda/builder-recap/builder-plan-guard.test.js

      - name: Validate JSON files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === 'node_modules' || entry.name === '.git') return [];
              const p = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(p) : [p];
            });
          }

          const jsonFiles = walk('.').filter(p => p.endsWith('.json'));
          for (const file of jsonFiles) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`OK ${file}`);
          }
          NODE

      - name: Verify canonical contract copies cannot drift
        run: |
          cmp -s contracts/bettings.schema.json lambda/builder-recap/contracts/bettings.schema.json
          cmp -s contracts/bettings.schema.json local-normaliser/bettings.schema.json
          cmp -s contracts/planner-prompt.md lambda/builder-recap/contracts/planner-prompt.md
          cmp -s contracts/runtime-contract.json lambda/builder-recap/contracts/runtime-contract.json
          cmp -s contracts/scene-contracts.json lambda/builder-recap/contracts/scene-contracts.json
          cmp -s contracts/scene-plan.schema.json lambda/builder-recap/contracts/scene-plan.schema.json
          cmp -s contracts/template-contract-audit.md lambda/builder-recap/contracts/template-contract-audit.md

      - name: Verify Scene 8 taxonomy and schema enum parity
        run: |
          node <<'NODE'
          const contracts = require('./contracts/scene-contracts.json');
          const schema = require('./contracts/scene-plan.schema.json');
          const taxonomy = Object.keys(contracts.scene8HeadlineTaxonomy || {}).sort();
          const schemaEnum = [...(schema?.$defs?.s8?.properties?.headlineCategory?.enum || [])].sort();
          if (!taxonomy.length) throw new Error('Scene 8 headline taxonomy is empty.');
          if (JSON.stringify(taxonomy) !== JSON.stringify(schemaEnum)) {
            throw new Error(`Scene 8 taxonomy/schema enum drift: taxonomy=${JSON.stringify(taxonomy)} schema=${JSON.stringify(schemaEnum)}`);
          }
          console.log(`Scene 8 taxonomy/schema parity OK (${taxonomy.length} categories)`);
          NODE

      - name: Syntax check Normaliser Python
        run: |
          python3 -m py_compile local-normaliser/normaliser.py
          python3 -m py_compile tests/normaliser/normaliser.py
          python3 -m py_compile tests/enrichment/enrich_pass2.py
          python3 -m py_compile tests/normaliser/test_finishing_position_zero.py
          echo "OK: Normaliser Python syntax validated."

      - name: Run Normaliser finishing-position regression
        run: python3 tests/normaliser/test_finishing_position_zero.py

      - name: Verify required builder baseline
        run: |
          test -f tests/fixtures/bettings-baseline.json
          test -f contracts/bettings.schema.json
          test -f contracts/planner-prompt.md
          test -f contracts/runtime-contract.json
          test -f contracts/scene-contracts.json
          test -f contracts/scene-plan.schema.json
          test -f lambda/builder-recap/index.js
          test -f lambda/builder-recap/recap-builder.js
          test -f lambda/builder-recap/recap-builder.test.js
          test -f lambda/builder-recap/builder-plan-guard.js
          test -f lambda/builder-recap/builder-plan-guard.test.js
          test -f lambda/builder-recap/package.json
          test -f lambda/builder-recap/package-lock.json
          test -f lambda/builder-recap/runtime/main-shell-template.html
          test -f lambda/builder-recap/runtime/recap-runtime.js
          for n in 1 2 3 4 5 6 7 8; do
            test -n "$(find lambda/builder-recap/templates -maxdepth 1 -type f -name "scene-${n}-*-template.html" -print -quit)"
          done

      - name: Verify Kubrick v2 planner scaffold
        run: |
          test -f contracts/deterministic-scene-plan.schema.json
          test -f lambda/scene-planner/bootstrap.js
          test -f lambda/scene-planner/index.js
          test -f lambda/scene-planner/package.json
          test -f lambda/scene-planner/package-lock.json
          test -f lambda/scene-planner/planner-policy.js
          test -f lambda/scene-planner/scene-planner.js
          node --check lambda/scene-planner/bootstrap.js
          node --check lambda/scene-planner/contract-loader.js
          node --check lambda/scene-planner/index.js
          node --check lambda/scene-planner/index.test.js
          node --check lambda/scene-planner/planner-policy.js
          node --check lambda/scene-planner/scene-planner.js
          node --check lambda/scene-planner/scene-planner.test.js
          node --check lambda/scene-planner/llm-copy-input.js
          node --check lambda/scene-planner/llm-copy-input.test.js
          node --check lambda/scene-planner/llm-copy-response.js
          node --check lambda/scene-planner/llm-copy-response.test.js
          node --check lambda/scene-planner/llm-copy-fallback.js
          node --check lambda/scene-planner/llm-copy-merge.js
          node --check lambda/scene-planner/llm-copy-merge.test.js
          node lambda/scene-planner/index.test.js
          node lambda/scene-planner/scene-planner.test.js
          node lambda/scene-planner/llm-copy-input.test.js
          node lambda/scene-planner/llm-copy-response.test.js
          node lambda/scene-planner/llm-copy-merge.test.js
          echo "OK: Kubrick v2 deterministic planner, one-call LLM copy boundary, deterministic copy fallback and final Builder compatibility validated."

      - name: Verify orchestrator scaffold
        run: |
          test -f lambda/orchestrator/index.js
          test -f lambda/orchestrator/index.test.js
          test -f lambda/orchestrator/package.json
          test -f infra/orchestrator.yml
          node --check lambda/orchestrator/index.js
          node --check lambda/orchestrator/index.test.js
          node lambda/orchestrator/index.test.js
          echo "OK: Orchestrator API entrypoint and IaC scaffold validated."

      - name: Reject obvious backup/history files
        run: |
          bad_files="$(find . -type d -name node_modules -prune -o -type d -name .git -prune -o -type f \( -iname '*backup*' -o -iname '*before-*' -o -iname '*BU.*' -o -iname '*BU' \) -print)"
          if [ -n "$bad_files" ]; then
            echo "Unexpected backup/history files found:"
            echo "$bad_files"
            exit 1
          fi
