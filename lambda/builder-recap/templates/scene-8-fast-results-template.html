<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scene 8 Fast Results</title><style>
/* SCENE_PRODUCTION_CSS_START */
.scene-type-8{--green:#22dc80;--green-soft:#8af0b7;--red:#ff5b6b;--white:#f7f9f8;--muted:#96a39d;--line:rgba(255,255,255,.12);position:absolute;left:0;right:0;top:var(--shell-top);bottom:var(--shell-bottom);padding:18px 5vw 82px;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(34,220,128,.09),transparent 34%),linear-gradient(180deg,#07100c,#050807 62%,#020403)}
.scene-type-8 .s8-wrap{width:min(900px,90vw);height:100%;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);align-content:start;position:relative;z-index:1}
.scene-type-8 .s8-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.scene-type-8 .s8-kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--green-soft)}
.scene-type-8 .s8-headline{font-size:clamp(22px,5.8vw,38px);line-height:1;font-weight:950;text-align:right}
.scene-type-8 .s8-list{display:grid;gap:6px;align-content:start}
.scene-type-8 .s8-footer{align-self:end;width:100%;padding:18px 2px 2px;border-top:1px solid rgba(255,255,255,.1);opacity:0;transform:translateY(10px);transition:opacity .42s ease,transform .42s ease}
.scene-type-8 .s8-footer.is-visible{opacity:1;transform:none}
.scene-type-8 .s8-block-reaction{font-size:clamp(24px,6.2vw,42px);line-height:1.02;font-weight:950;letter-spacing:-.02em;max-width:820px}
.scene-type-8 .s8-block-summary{margin-top:8px;color:var(--muted);font-size:clamp(11px,2.6vw,15px);font-weight:900;letter-spacing:.09em;text-transform:uppercase}
.scene-type-8 .s8-bet{position:relative;min-height:44px;border:1px solid var(--line);border-radius:11px;background:rgba(8,13,11,.8);padding:6px 9px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(100px,.75fr);gap:9px;align-items:center;overflow:hidden;opacity:0;transform:translateY(7px);transition:border-color .18s ease,background .18s ease,transform .18s ease}
.scene-type-8.play .s8-bet{animation:s8rowin .28s ease forwards}
.scene-type-8.play .s8-bet:nth-child(1){animation-delay:.35s}.scene-type-8.play .s8-bet:nth-child(2){animation-delay:1.65s}.scene-type-8.play .s8-bet:nth-child(3){animation-delay:2.95s}.scene-type-8.play .s8-bet:nth-child(4){animation-delay:4.25s}.scene-type-8.play .s8-bet:nth-child(5){animation-delay:5.55s}
.scene-type-8 .s8-bet::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);pointer-events:none}
.scene-type-8 .s8-main{min-width:0;display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:center}
.scene-type-8 .s8-dot{width:7px;height:7px;border-radius:50%;background:#34403a;box-shadow:0 0 0 2px rgba(255,255,255,.03);transition:.18s ease}
.scene-type-8 .s8-horse{font-size:clamp(14px,3.2vw,19px);font-weight:950;line-height:1.02;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.scene-type-8 .s8-meta{margin-top:2px;font-size:clamp(10px,2.2vw,12px);line-height:1.15;color:var(--muted);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-type-8 .s8-result{text-align:right;opacity:0;visibility:hidden;transform:translateX(5px);transition:opacity .16s ease,transform .16s ease}
.scene-type-8 .s8-topline{display:flex;justify-content:flex-end;gap:7px;align-items:baseline}
.scene-type-8 .s8-finish{font-size:10px;font-weight:900;color:#b8c3be}
.scene-type-8 .s8-outcome{font-size:clamp(15px,3.4vw,20px);font-weight:950}
.scene-type-8 .s8-comment{margin-top:1px;font-size:clamp(10px,2.1vw,12px);line-height:1.02;font-weight:850;color:#dfe7e3;white-space:normal;overflow:visible;text-overflow:clip}
.scene-type-8 .s8-bet.is-resolved{transform:translateX(2px)}
.scene-type-8 .s8-bet.is-resolved::after{animation:s8sweep .5s ease}
.scene-type-8 .s8-bet.is-resolved .s8-result{opacity:1;visibility:visible;transform:none}
.scene-type-8 .s8-bet.win.is-resolved{border-color:rgba(34,220,128,.42);background:rgba(20,76,49,.26)}
.scene-type-8 .s8-bet.loss.is-resolved{border-color:rgba(255,91,107,.3);background:rgba(72,22,29,.2)}
.scene-type-8 .s8-bet.win.is-resolved .s8-dot{background:var(--green);box-shadow:0 0 9px rgba(34,220,128,.72)}
.scene-type-8 .s8-bet.loss.is-resolved .s8-dot{background:var(--red);box-shadow:0 0 7px rgba(255,91,107,.5)}
.scene-type-8 .s8-bet.win .s8-outcome{color:var(--green-soft)}.scene-type-8 .s8-bet.loss .s8-outcome{color:var(--red)}
@keyframes s8rowin{to{opacity:1;transform:none}}
@keyframes s8sweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.scene-type-8[data-bet-count="5"] .s8-list{gap:5px}.scene-type-8[data-bet-count="5"] .s8-bet{min-height:42px}
@media(orientation:portrait){.scene-type-8{padding:12px 4vw 86px}.scene-type-8 .s8-wrap{width:92vw}.scene-type-8 .s8-head{margin-bottom:7px}.scene-type-8 .s8-headline{font-size:clamp(20px,5.8vw,30px)}.scene-type-8 .s8-list{gap:5px}.scene-type-8 .s8-bet{min-height:50px;padding:5px 8px;border-radius:9px;grid-template-columns:minmax(0,1.52fr) minmax(88px,.72fr);gap:7px}.scene-type-8[data-bet-count="5"] .s8-bet{min-height:46px}.scene-type-8 .s8-main{gap:7px}.scene-type-8 .s8-meta{font-size:9px}.scene-type-8 .s8-horse{font-size:14px}.scene-type-8 .s8-finish{font-size:9px}.scene-type-8 .s8-outcome{font-size:14px}.scene-type-8 .s8-comment{font-size:10px}.scene-type-8 .s8-footer{padding-top:14px}.scene-type-8 .s8-block-reaction{font-size:clamp(23px,6.6vw,34px);max-width:94%}.scene-type-8 .s8-block-summary{margin-top:6px;font-size:10px}}
@media(orientation:landscape) and (max-height:900px){.scene-type-8{padding:8px 7vw 100px}.scene-type-8 .s8-wrap{width:min(840px,84vw)}.scene-type-8 .s8-head{margin-bottom:5px}.scene-type-8 .s8-headline{font-size:24px}.scene-type-8 .s8-list{gap:4px}.scene-type-8 .s8-bet{min-height:32px;padding:2px 6px}.scene-type-8[data-bet-count="5"] .s8-bet{min-height:30px}.scene-type-8 .s8-horse{font-size:15px}.scene-type-8 .s8-meta{font-size:9px}.scene-type-8 .s8-finish{font-size:9px}.scene-type-8 .s8-outcome{font-size:14px}.scene-type-8 .s8-comment{font-size:9px}.scene-type-8 .s8-footer{padding-top:10px}.scene-type-8 .s8-block-reaction{font-size:clamp(22px,2.4vw,34px)}.scene-type-8 .s8-block-summary{margin-top:5px;font-size:10px}}
.scene-type-8 .s8-horse.trifecta-selection{font-size:clamp(11px,1.55vw,14px);line-height:1.12;overflow-wrap:anywhere}
/* Fast-result cards must allow the name column to shrink without covering results. */
.scene-type-8 .s8-main,.scene-type-8 .s8-main>div{min-width:0}
.scene-type-8 .s8-horse{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:normal}
@media (orientation:portrait) and (max-width:640px){
 .scene-type-8 .s8-horse.long-single-word{font-size:clamp(11px,3.25vw,14px);line-height:1.12}
 .scene-type-8 .s8-meta{overflow-wrap:anywhere}
}
/* SCENE_PRODUCTION_CSS_END */
</style></head><body>
<!-- SCENE_PRODUCTION_MARKUP_START -->
<section class="scene scene-type-8" data-scene-type="8" data-scene-instance-id="{{sceneInstanceId}}" data-bet-count="{{betCount}}" data-scene-duration-ms="{{sceneDurationMs}}" data-result-reveal-ms="{{resultRevealMs}}">
  <div class="s8-wrap">
    <div class="s8-head"><div class="s8-kicker">NEXT {{betCount}}</div><div class="s8-headline">{{headline}}</div></div>
    <div class="s8-list">
      {{#races}}<article class="s8-bet {{outcomeClass}}" data-race="{{raceIndex}}" data-running-pnl="{{runningPnl}}" data-race-time="{{raceTimeDisplay}}">
        <div class="s8-main"><span class="s8-dot"></span><div><div class="s8-horse {{horseNameClass}}">{{horseName}}</div><div class="s8-meta">{{meetingName}} • R{{raceNumber}} • {{betType}}{{oddsSuffix}} • {{stakeDisplay}}</div></div></div>
        <div class="s8-result"><div class="s8-topline"><span class="s8-finish">{{finishLabel}}</span><span class="s8-outcome">{{betResult}} {{betProfitLossDisplay}}</span></div><div class="s8-comment">{{comment}}</div></div>
      </article>{{/races}}
    </div>
    <div class="s8-footer" data-role="s8-footer">
      <div class="s8-block-reaction">{{blockReaction}}</div>
      <div class="s8-block-summary">{{blockSummaryLine}}</div>
    </div>
  </div>
</section>
<!-- SCENE_PRODUCTION_MARKUP_END -->
</body></html>
