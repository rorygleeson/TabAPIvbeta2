<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scene 7 Template</title><style>
/* PREVIEW_ONLY_CSS */:root{--green:#29e082;--green2:#93f2bd;--white:#f7faf8;--muted:#9aa8a1;--line:rgba(255,255,255,.11);--shell-top:58px;--shell-bottom:56px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020503;color:var(--white);font-family:Arial,sans-serif;overflow:hidden}@media(orientation:portrait){:root{--shell-top:92px;--shell-bottom:76px}}
/* SCENE_PRODUCTION_CSS_START */
.scene-type-7{--green:#29e082;--green2:#93f2bd;--white:#f7faf8;--muted:#9aa8a1;--line:rgba(255,255,255,.11);position:absolute;left:0;right:0;top:var(--shell-top);bottom:var(--shell-bottom);display:flex;align-items:center;justify-content:center;padding:32px 6vw 42px;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(41,224,130,.15),transparent 36%),linear-gradient(180deg,#07100c 0%,#030604 100%)}.scene-type-7::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,black 12%,black 90%,transparent)}.scene-type-7 .s7-card{position:relative;z-index:1;width:min(900px,88vw);padding:clamp(28px,6vw,54px);border:1px solid rgba(80,255,161,.17);border-radius:34px;background:linear-gradient(180deg,rgba(34,84,57,.48),rgba(10,25,18,.74)),rgba(12,29,21,.74);box-shadow:0 28px 80px rgba(0,0,0,.36);text-align:center}.scene-type-7 .s7-kicker{color:var(--green2);font-size:13px;letter-spacing:.17em;font-weight:950;opacity:0;transform:translateY(8px)}.scene-type-7 .s7-hero{margin:16px auto 0;max-width:760px;font-size:clamp(43px,10vw,76px);line-height:.96;letter-spacing:-.05em;font-weight:950;opacity:0;transform:scale(.97)}.scene-type-7 .s7-hero.positive{color:var(--green)}.scene-type-7 .s7-hero.break-even{color:var(--white)}.scene-type-7 .s7-hero.negative{color:var(--white)}.scene-type-7 .s7-dots{display:flex;justify-content:center;gap:8px;margin:22px 0 0;opacity:0}.scene-type-7 .s7-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}.scene-type-7 .s7-chips{margin:24px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px}.scene-type-7 .s7-chip{border:1px solid var(--line);border-radius:999px;background:rgba(4,12,8,.52);padding:11px 15px;font-size:12px;letter-spacing:.06em;font-weight:950;opacity:0;transform:translateY(8px)}.scene-type-7 .s7-summary{margin:24px auto 0;max-width:710px;font-size:clamp(18px,4vw,27px);line-height:1.24;font-weight:800;color:#dce5e0;opacity:0;transform:translateY(8px)}.scene-type-7 .s7-share{width:min(620px,100%);margin:28px auto 0;border:0;border-radius:17px;padding:19px 24px;background:var(--green);color:#041009;font-size:clamp(16px,3.8vw,21px);font-weight:950;cursor:pointer;box-shadow:0 14px 40px rgba(41,224,130,.22);opacity:0;transform:translateY(10px) scale(.99)}.scene-type-7 .s7-share:active{transform:scale(.985)}.scene-type-7 .s7-share[disabled]{cursor:default;opacity:.72}.scene-type-7 .s7-foot{margin-top:14px;color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:800;opacity:0}.scene-type-7.play .s7-kicker{animation:s7in .4s ease forwards .2s}.scene-type-7.play .s7-hero{animation:s7pop .52s cubic-bezier(.2,.85,.2,1) forwards .65s}.scene-type-7.play .s7-dots{animation:s7fade .25s ease forwards 1.3s}.scene-type-7.play .s7-dot:nth-child(1){animation:s7dot .34s ease forwards 1.40s}.scene-type-7.play .s7-dot:nth-child(2){animation:s7dot .34s ease forwards 1.55s}.scene-type-7.play .s7-dot:nth-child(3){animation:s7dot .34s ease forwards 1.70s}.scene-type-7.play .s7-dot:nth-child(4){animation:s7dot .34s ease forwards 1.85s}.scene-type-7.play .s7-chip:nth-child(1){animation:s7in .42s ease forwards 1.90s}.scene-type-7.play .s7-chip:nth-child(2){animation:s7in .42s ease forwards 2.55s}.scene-type-7.play .s7-chip:nth-child(3){animation:s7in .42s ease forwards 3.20s}.scene-type-7.play .s7-chip:nth-child(4){animation:s7in .42s ease forwards 3.85s}.scene-type-7.play .s7-summary{animation:s7in .45s ease forwards 4.8s}.scene-type-7.play .s7-share{animation:s7pop .5s cubic-bezier(.2,.85,.2,1) forwards 6s}.scene-type-7.play .s7-foot{animation:s7fade .35s ease forwards 6.7s}@keyframes s7in{to{opacity:1;transform:none}}@keyframes s7pop{to{opacity:1;transform:none}}@keyframes s7fade{to{opacity:1}}@keyframes s7dot{0%{background:rgba(255,255,255,.16);transform:scale(.8)}65%{background:var(--green);transform:scale(1.15)}100%{background:var(--green);transform:scale(1)}}@media(max-width:620px){.scene-type-7{padding-left:5vw;padding-right:5vw}.scene-type-7 .s7-card{width:90vw;padding:30px 20px}.scene-type-7 .s7-chip{font-size:11px;padding:10px 12px}}
/* SCENE_PRODUCTION_CSS_END */</style></head><body>
<!-- SCENE_PRODUCTION_MARKUP_START --><section class="scene-type-7" data-scene-type="7" data-scene-instance-id="{{sceneInstanceId}}"><div class="s7-card"><div class="s7-kicker">{{userName}}'S RACING DAY</div><div class="s7-hero {{heroOutcomeClass}}">{{finalHeroText}}</div><div class="s7-dots" aria-hidden="true"><span class="s7-dot"></span><span class="s7-dot"></span><span class="s7-dot"></span><span class="s7-dot"></span></div><div class="s7-chips">{{#resolvedFinalHighlights}}<div class="s7-chip">{{text}}</div>{{/resolvedFinalHighlights}}</div><div class="s7-summary">{{finalSummary}}</div><button class="s7-share" data-role="share-recap" type="button">↗ SHARE {{userNameUpper}}'S RECAP</button><div class="s7-foot">YOUR DAY • YOUR BETS • YOUR RECAP</div></div></section><!-- SCENE_PRODUCTION_MARKUP_END -->
<!-- Share payload is delivered through recap-runtime-data. --></body></html>
