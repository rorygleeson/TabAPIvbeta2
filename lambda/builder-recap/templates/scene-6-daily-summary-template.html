<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scene 6 Template</title><style>
/* PREVIEW_ONLY_CSS */:root{--green:#27e082;--green-soft:#8ef1b8;--red:#ff5b6c;--white:#f7f9f8;--muted:#9ba8a2;--line:rgba(255,255,255,.12);--shell-top:58px;--shell-bottom:56px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050807;color:var(--white);font-family:Arial,sans-serif;overflow:hidden}@media(orientation:portrait){:root{--shell-top:92px;--shell-bottom:76px}}
/* SCENE_PRODUCTION_CSS_START */
.scene-type-6{--green:#27e082;--green-soft:#8ef1b8;--red:#ff5b6c;--white:#f7f9f8;--muted:#9ba8a2;--line:rgba(255,255,255,.12);position:absolute;left:0;right:0;top:var(--shell-top);bottom:var(--shell-bottom);padding:34px 7vw 76px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 45% 30%,rgba(39,224,130,.12),transparent 34%),linear-gradient(180deg,#07100c,#050807 58%,#020403)}.scene-type-6::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,black 12%,black 88%,transparent);pointer-events:none}.scene-type-6 .s6-wrap{position:relative;z-index:1;width:min(880px,86vw);margin:auto}.scene-type-6 .s6-kicker{font-size:clamp(13px,2.7vw,18px);letter-spacing:.18em;font-weight:900;color:var(--green-soft);opacity:0;transform:translateY(8px)}.scene-type-6 .s6-hero{margin-top:12px;font-size:clamp(42px,10.8vw,78px);line-height:.95;font-weight:950}.scene-type-6 .lead{display:block;opacity:0;transform:translateY(10px)}.scene-type-6 .pnl{display:block;opacity:0;transform:scale(.95)}.scene-type-6 .pnl.positive{color:var(--green)}.scene-type-6 .pnl.negative{color:var(--red)}.scene-type-6 .pnl.zero{color:var(--white)}.scene-type-6 .s6-dots{display:flex;gap:8px;margin:18px 0 2px;opacity:0}.scene-type-6 .s6-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}.scene-type-6 .s6-grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene-type-6 .s6-tile{border:1px solid var(--line);border-radius:20px;background:rgba(8,13,11,.76);padding:18px 20px;min-height:126px;opacity:0;transform:translateY(10px)}.scene-type-6 .s6-tile-label{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:900}.scene-type-6 .s6-tile-value{margin-top:10px;font-size:clamp(34px,8vw,58px);font-weight:950}.scene-type-6 .s6-final.positive .s6-tile-value{color:var(--green)}.scene-type-6 .s6-final.negative .s6-tile-value{color:var(--red)}.scene-type-6 .s6-final.zero .s6-tile-value{color:var(--white)}.scene-type-6 .s6-facts{margin-top:18px;font-size:clamp(16px,3.7vw,24px);line-height:1.35;color:#c6d0cb;font-weight:700;opacity:0;transform:translateY(8px)}.scene-type-6 .s6-facts strong{color:#fff}.scene-type-6 .s6-verdict{margin-top:18px;font-size:clamp(24px,5.8vw,40px);font-weight:950;opacity:0;transform:translateY(8px)}.scene-type-6 .s6-highlight{margin-top:12px;font-size:clamp(14px,3.1vw,20px);color:var(--green-soft);font-weight:850;opacity:0;transform:translateY(8px)}.scene-type-6.play .s6-kicker{animation:s6in .4s ease forwards .2s}.scene-type-6.play .lead{animation:s6in .42s ease forwards .65s}.scene-type-6.play .pnl{animation:s6pop .5s ease forwards 1.05s}.scene-type-6.play .s6-dots{animation:s6fade .25s ease forwards 1.55s}.scene-type-6.play .s6-dot:nth-child(1){animation:s6dot .34s ease forwards 1.65s}.scene-type-6.play .s6-dot:nth-child(2){animation:s6dot .34s ease forwards 1.82s}.scene-type-6.play .s6-dot:nth-child(3){animation:s6dot .34s ease forwards 1.99s}.scene-type-6.play .s6-dot:nth-child(4){animation:s6dot .34s ease forwards 2.16s}.scene-type-6.play .s6-dot:nth-child(5){animation:s6dot .34s ease forwards 2.33s}.scene-type-6.play .s6-tile:nth-child(1){animation:s6in .42s ease forwards 2.35s}.scene-type-6.play .s6-tile:nth-child(2){animation:s6in .42s ease forwards 3.15s}.scene-type-6.play .s6-tile:nth-child(3){animation:s6in .42s ease forwards 3.95s}.scene-type-6.play .s6-tile:nth-child(4){animation:s6in .42s ease forwards 4.75s}.scene-type-6.play .s6-facts{animation:s6in .42s ease forwards 5.7s}.scene-type-6.play .s6-verdict{animation:s6in .45s ease forwards 6.7s}.scene-type-6.play .s6-highlight{animation:s6in .42s ease forwards 7.8s}@keyframes s6in{to{opacity:1;transform:none}}@keyframes s6pop{to{opacity:1;transform:scale(1)}}@keyframes s6fade{to{opacity:1}}@keyframes s6dot{0%{background:rgba(255,255,255,.16);transform:scale(.8)}60%{background:var(--green);transform:scale(1.15)}100%{background:var(--green);transform:scale(1)}}@media(max-width:640px){.scene-type-6{padding-left:6vw;padding-right:6vw;padding-top:28px}.scene-type-6 .s6-wrap{width:88vw}.scene-type-6 .s6-grid{gap:10px}.scene-type-6 .s6-tile{padding:15px 16px;min-height:112px}}
@media (orientation:portrait) and (max-width:640px){
  .scene-type-6{align-items:flex-start;justify-content:center;padding:18px 6vw 22px}
  .scene-type-6 .s6-wrap{width:88vw;margin:0 auto}
  .scene-type-6 .s6-kicker{font-size:12px}
  .scene-type-6 .s6-hero{margin-top:7px;font-size:clamp(34px,9.2vw,46px);line-height:.94}
  .scene-type-6 .s6-dots{gap:7px;margin:10px 0 1px}
  .scene-type-6 .s6-dot{width:7px;height:7px}
  .scene-type-6 .s6-grid{margin-top:10px;gap:8px}
  .scene-type-6 .s6-tile{padding:10px 12px;min-height:82px;border-radius:16px}
  .scene-type-6 .s6-tile-label{font-size:10px}
  .scene-type-6 .s6-tile-value{margin-top:5px;font-size:clamp(28px,8vw,40px)}
  .scene-type-6 .s6-facts{margin-top:10px;font-size:clamp(14px,3.8vw,17px);line-height:1.25}
  .scene-type-6 .s6-verdict{margin-top:10px;font-size:clamp(19px,5.2vw,26px);line-height:1.08}
  .scene-type-6 .s6-highlight{margin-top:7px;font-size:clamp(13px,3.5vw,16px);line-height:1.2}
}

/* LAPTOP / SHORT LANDSCAPE COMPACTION — ALIGNED WITH SCENES 2, 4 & 5 */
@media (orientation:landscape) and (max-height:900px){
  .scene-type-6{
    align-items:flex-start;
    padding:16px 7vw 118px;
  }

  .scene-type-6 .s6-wrap{
    width:min(800px,82vw);
  }

  .scene-type-6 .s6-kicker{
    font-size:11px;
  }

  .scene-type-6 .s6-hero{
    margin-top:6px;
    font-size:clamp(30px,3.25vw,44px);
    line-height:.96;
  }

  .scene-type-6 .s6-dots{
    gap:6px;
    margin:8px 0 1px;
  }

  .scene-type-6 .s6-dot{
    width:6px;
    height:6px;
  }

  .scene-type-6 .s6-grid{
    margin-top:9px;
    gap:7px;
  }

  .scene-type-6 .s6-tile{
    padding:9px 12px;
    min-height:68px;
    border-radius:13px;
  }

  .scene-type-6 .s6-tile-label{
    font-size:9px;
  }

  .scene-type-6 .s6-tile-value{
    margin-top:5px;
    font-size:clamp(22px,2.25vw,31px);
  }

  .scene-type-6 .s6-facts{
    margin-top:9px;
    font-size:clamp(12px,1.05vw,15px);
    line-height:1.25;
  }

  .scene-type-6 .s6-verdict{
    margin-top:8px;
    font-size:clamp(18px,1.65vw,23px);
    line-height:1.1;
  }

  .scene-type-6 .s6-highlight{
    margin-top:6px;
    font-size:clamp(12px,1.05vw,15px);
    line-height:1.2;
  }
}
/* SCENE_PRODUCTION_CSS_END */</style></head><body>
<!-- SCENE_PRODUCTION_MARKUP_START --><section class="scene-type-6" data-scene-type="6" data-scene-instance-id="{{sceneInstanceId}}"><div class="s6-wrap"><div class="s6-kicker">{{userName}}'S FINAL SCORE</div><div class="s6-hero"><span class="lead">THAT'S A</span><span class="pnl {{finalPnlSignClass}}">{{finalPnlDisplay}} DAY.</span></div><div class="s6-dots" aria-hidden="true"><span class="s6-dot"></span><span class="s6-dot"></span><span class="s6-dot"></span><span class="s6-dot"></span><span class="s6-dot"></span></div><div class="s6-grid"><div class="s6-tile"><div class="s6-tile-label">BETS</div><div class="s6-tile-value">{{totalBets}}</div></div><div class="s6-tile"><div class="s6-tile-label">STAKED</div><div class="s6-tile-value">{{totalStakedDisplay}}</div></div><div class="s6-tile"><div class="s6-tile-label">RETURNED</div><div class="s6-tile-value">{{totalReturnedDisplay}}</div></div><div class="s6-tile s6-final {{finalPnlSignClass}}"><div class="s6-tile-label">P&amp;L</div><div class="s6-tile-value">{{finalPnlDisplay}}</div></div></div><div class="s6-facts"><strong>{{winsLossesDisplay}}</strong> • biggest win: <strong>{{biggestWinSummary}}</strong></div><div class="s6-verdict">{{dayVerdict}}</div><div class="s6-highlight">{{standoutCopy}}</div></div></section><!-- SCENE_PRODUCTION_MARKUP_END -->
</body></html>
